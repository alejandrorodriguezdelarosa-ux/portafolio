server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip para texto (NO para vídeo/imágenes, ya están comprimidos)
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Cache largo para vídeo e imágenes (1 año)
    location ~* \.(mp4|webm|ogg|jpg|jpeg|png|gif|webp|svg|woff|woff2|ttf|eot|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Cache corto para HTML (debe recargarse)
    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Cabeceras de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Soporte para range requests (necesario para reproducción de vídeo seekable)
    location ~* \.(mp4|webm|ogg)$ {
        add_header Accept-Ranges bytes;
    }

    # Página principal y fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /index.html;
}
